<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniel Garrido</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg-1:#a1a1a1;
  --bg-2:#1c1c1c;
  --text:#fff;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,sans-serif;
  background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
  color:var(--text);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:40px 20px 140px;
}

.container{max-width:480px;width:100%;text-align:center}
.logo{max-height:50px;margin-bottom:20px}
.profile{
  width:120px;height:120px;border-radius:50%;
  object-fit:cover;border:4px solid rgba(255,255,255,.15);
  margin-bottom:16px;
}
h1{font-size:1.5rem;font-weight:800}
h2{font-size:1rem;opacity:.8;margin:6px 0 16px}
.bio{opacity:.7;margin-bottom:26px}

.socials{display:flex;justify-content:center;gap:12px;margin-bottom:30px}
.socials a{
  width:45px;height:45px;border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center;
}

.section{font-size:.8rem;letter-spacing:1px;opacity:.6;margin:30px 0 15px}

.list{display:flex;flex-direction:column;gap:14px}
.item{
  display:flex;align-items:center;
  background:rgba(255,255,255,.08);
  border-radius:50px;
  padding:8px;
  text-decoration:none;color:#fff;
}
.icon{
  width:50px;height:50px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;margin-right:10px;
}
.label{flex:1;font-weight:600}

.dock{
  position:fixed;bottom:30px;left:50%;
  transform:translateX(-50%);
  width:90%;max-width:400px;
  background:rgba(20,20,20,.85);
  backdrop-filter:blur(20px);
  border-radius:24px;
  display:flex;gap:10px;padding:8px;
}
.dock a, .dock button{
  flex:1;border:none;border-radius:18px;
  padding:12px;
  font-weight:600;
  background:rgba(255,255,255,.1);
  color:#fff;
  text-decoration:none;
}
.primary{background:#3b82f6}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">
<img src="profile.png" class="profile">

<h1>Daniel Garrido</h1>
<h2>Chief Creative & Marketing Officer</h2>
<p class="bio">Design · Strategy · Growth</p>

<div class="socials">
  <a href="#" target="_blank"><i class="bi bi-instagram"></i></a>
  <a href="#" target="_blank"><i class="bi bi-facebook"></i></a>
  <a href="#" target="_blank"><i class="bi bi-linkedin"></i></a>
</div>

<div class="section">INFORMACIÓN DE CONTACTO</div>

<div class="list">
  <a class="item" href="https://wa.me/5215544522208" target="_blank">
    <div class="icon" style="background:#25D366"><i class="bi bi-whatsapp"></i></div>
    <div class="label">WhatsApp</div>
  </a>

  <a class="item" href="tel:+525544522208">
    <div class="icon" style="background:#007bff"><i class="bi bi-telephone-fill"></i></div>
    <div class="label">Llamar</div>
  </a>

  <a class="item" href="mailto:correo@dominio.com">
    <div class="icon" style="background:#EA4335"><i class="bi bi-envelope-fill"></i></div>
    <div class="label">Email</div>
  </a>

  <a class="item" href="https://tusitio.com" target="_blank">
    <div class="icon" style="background:#333"><i class="bi bi-globe"></i></div>
    <div class="label">Sitio Web</div>
  </a>
</div>

</div>

<div class="dock">
  <button onclick="share()">Compartir</button>
  <a href="contacto.vcf" class="primary" download>Guardar</a>
</div>

<script>
function share(){
  if(navigator.share){
    navigator.share({
      title:'Daniel Garrido',
      text:'Mi tarjeta digital',
      url:location.href
    })
  }else{
    navigator.clipboard.writeText(location.href);
    alert("Enlace copiado");
  }
}
</script>

</body>
</html>
