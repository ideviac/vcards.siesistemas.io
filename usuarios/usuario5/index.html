<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Itzel Salas Fuentes - vCard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f6f6;
      padding: 30px;
    }
    .card {
      background: #fff;
      max-width: 420px;
      margin: auto;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,.08);
      text-align: center;
    }
    .photo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
    }
    .name {
      font-size: 22px;
      font-weight: bold;
      margin: 8px 0;
    }
    .role {
      color: #666;
      margin-bottom: 18px;
    }
    .item {
      margin: 8px 0;
    }
    a.button {
      display: block;
      margin-top: 18px;
      padding: 14px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
    }
    a.button:hover {
      background: #333;
    }
  </style>
</head>

<body>
  <div class="card">
    <!-- Opcional -->
    <!-- <img src="foto.jpg" class="photo"> -->

    <div class="name">Itzel Salas Fuentes</div>
    <div class="role">Director Jurídico</div>

    <div class="item">📞 <a href="tel:+52 55 2243 6883">+52 55 2243 6883</a></div>
    <div class="item">✉️ <a href="mailto:itzel.salas@siesistemas.com.mx">itzel.salas@siesistemas.com.mx</a></div>
    <div class="item">🌐 <a href="https://www.sietechsystems.com/" target="_blank">https://www.sietechsystems.com/</a></div>

    <a class="button" href="contacto.vcf" download>
      Guardar contacto
    </a>
  </div>
</body>
</html>
